<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yogho Yogho</title>
<style>
  :root { --bg: #111; --fg: #ddd; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; padding: 16px; box-sizing: border-box; }
  canvas { width: min(100%, 960px); aspect-ratio: 4 / 3; image-rendering: pixelated; background: #000; }
  #status { margin-top: 8px; opacity: .7; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Laden…</div>
</div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    setStatus: function (s) { document.getElementById('status').textContent = s || ''; },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); }
  };
  document.getElementById('canvas').addEventListener('click', function () { this.focus(); });
</script>
<script src="yogho.js"></script>
</body>
</html>
